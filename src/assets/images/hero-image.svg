    <rect x="95" y="45" width="165" height="6" rx="3" fill="rgb(125, 125, 125)" />
    <rect x="95" y="57" width="140" height="6" rx="3" fill="rgb(125, 125, 125)" />

    <rect x="95" y="85" width="165" height="65" rx="6" fill="rgb(16, 16, 16)" stroke="rgb(38, 38, 38)" stroke-width="1" />
    <rect x="105" y="95" width="16" height="16" rx="4" fill="rgb(77, 77, 77)" />
    <rect x="127" y="99" width="60" height="8" rx="4" fill="rgb(237, 237, 237)" />
    <rect x="105" y="120" width="140" height="6" rx="3" fill="rgb(77, 77, 77)" />
    <rect x="105" y="132" width="100" height="6" rx="3" fill="rgb(77, 77, 77)" />

    <rect x="95" y="160" width="165" height="65" rx="6" fill="rgb(16, 16, 16)" stroke="rgb(38, 38, 38)" stroke-width="1" />
    <rect x="105" y="170" width="16" height="16" rx="4" fill="rgb(77, 77, 77)" />
    <rect x="127" y="174" width="40" height="8" rx="4" fill="rgb(237, 237, 237)" />
    <rect x="105" y="195" width="140" height="6" rx="3" fill="rgb(77, 77, 77)" />
    <rect x="105" y="207" width="120" height="6" rx="3" fill="rgb(77, 77, 77)" />
  </g>

  <g transform="translate(180, 260)" filter="url(#shadow-card)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="rgb(16, 16, 16)" stroke="rgb(232, 185, 58)" stroke-width="1.5" />
    <circle cx="24" cy="24" r="10" fill="rgb(232, 185, 58)" opacity="0.2"/>
    <rect x="19" y="19" width="10" height="10" rx="2" fill="rgb(232, 185, 58)" />
    
    <rect x="42" y="20" width="80" height="8" rx="4" fill="rgb(237, 237, 237)" />
    <rect x="16" y="45" width="128" height="6" rx="3" fill="rgb(125, 125, 125)" />
    <rect x="16" y="57" width="90" height="6" rx="3" fill="rgb(125, 125, 125)" />
