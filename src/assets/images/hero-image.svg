<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" style="background-color: transparent; color-scheme: dark;">
  <defs>

    <filter id="shadow-hero" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="rgb(0,0,0)" flood-opacity="0.75"/>
    </filter>

    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="rgb(0,0,0)" flood-opacity="0.8"/>
    </filter>

    <linearGradient id="edge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(77, 77, 77)" />
      <stop offset="50%" stop-color="rgb(38, 38, 38)" />
      <stop offset="100%" stop-color="rgb(232, 185, 58)" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grid-sm)" opacity="0.6"/>
  <circle cx="280" cy="120" r="180" fill="url(#glow-gold)" />
  <circle cx="80" cy="320" r="150" fill="url(#glow-cyan)" />

  <g transform="translate(40, 20) scale(0.85)" filter="url(#shadow-hero)" opacity="0.6">
    <rect x="0" y="0" width="300" height="220" rx="12" fill="rgb(16, 16, 16)" stroke="rgb(38, 38, 38)" stroke-width="1.5" />

    <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 288 0 C 294.627 0 300 5.373 300 12 L 300 30 L 0 30 Z" fill="rgb(24, 24, 24)" />
    <circle cx="16" cy="15" r="3.5" fill="rgb(77, 77, 77)" />
    <circle cx="28" cy="15" r="3.5" fill="rgb(77, 77, 77)" />
    <circle cx="40" cy="15" r="3.5" fill="rgb(77, 77, 77)" />
    <line x1="0" y1="30" x2="300" y2="30" stroke="rgb(38, 38, 38)" stroke-width="1" />

    <rect x="20" y="50" width="80" height="8" rx="4" fill="rgb(77, 77, 77)" />
    <rect x="110" y="50" width="120" height="8" rx="4" fill="rgb(125, 125, 125)" />
    <rect x="20" y="70" width="160" height="8" rx="4" fill="rgb(125, 125, 125)" />
    <rect x="20" y="90" width="240" height="8" rx="4" fill="rgb(77, 77, 77)" />
    <rect x="40" y="110" width="180" height="8" rx="4" fill="rgb(237, 237, 237)" opacity="0.5"/>
    <rect x="40" y="130" width="140" height="8" rx="4" fill="rgb(77, 77, 77)" />
    <rect x="20" y="150" width="60" height="8" rx="4" fill="rgb(125, 125, 125)" />
  </g>

  <g transform="translate(60, 110)" filter="url(#shadow-hero)">
    <rect x="0" y="0" width="280" height="260" rx="14" fill="rgb(10, 10, 10)" stroke="url(#edge-glow)" stroke-width="1.5" />

    <rect x="0" y="0" width="80" height="260" rx="14" fill="rgb(16, 16, 16)" />
    <line x1="80" y1="0" x2="80" y2="260" stroke="rgb(38, 38, 38)" stroke-width="1" />

    <rect x="12" y="20" width="14" height="14" rx="4" fill="rgb(237, 237, 237)" />
    <rect x="32" y="24" width="36" height="6" rx="3" fill="rgb(237, 237, 237)" />
    
    <rect x="12" y="55" width="56" height="6" rx="3" fill="rgb(77, 77, 77)" />
    
    <rect x="8" y="75" width="64" height="20" rx="4" fill="rgb(232, 185, 58)" opacity="0.1" />
    <rect x="8" y="78" width="2" height="14" fill="rgb(232, 185, 58)" />
    <rect x="16" y="82" width="46" height="6" rx="3" fill="rgb(232, 185, 58)" />
    
